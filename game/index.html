<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solara Vice</title>
<style>
  /* The whole page is the game: a canvas that fills the window, letterboxed onto a warm dark
     surround so widescreen and 4:3 monitors both look deliberate. */
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0d0b0c;
    color: #f6f0e2;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #screen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: crosshair;
    background: #0d0b0c;
  }
  /* A loading veil the game removes once the first frame is up. */
  #veil {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(120% 100% at 70% 80%, #3a1c12 0%, #17100f 55%, #0b0909 100%);
    transition: opacity 420ms ease;
    z-index: 5;
  }
  #veil.gone { opacity: 0; pointer-events: none; }
  #veil .title {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 4px;
    color: #ffd894;
    text-shadow: 0 2px 18px rgba(255, 140, 70, 0.35);
    text-align: center;
  }
  #veil .sub {
    margin-top: 10px;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(246, 240, 226, 0.45);
    text-align: center;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="screen" width="1280" height="720"
        aria-label="Solara Vice: an open-world crime game in a sun-bleached coastal city. Walk, drive, and take jobs across the districts of Solara Bay."></canvas>
<div id="veil"><div class="title">SOLARA VICE</div><div class="sub">loading the bay</div></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
<script>
  // Drop the veil once the game signals its first settled frame; the cap keeps a broken boot from
  // hiding the canvas forever.
  (function () {
    var veil = document.getElementById('veil');
    var status = document.getElementById('status');
    if (status) status.textContent = 'Solara Vice is loading.';
    var tries = 0;
    var tick = setInterval(function () {
      tries += 1;
      if (window.__shotReady || tries > 240) {
        clearInterval(tick);
        veil.className = 'gone';
        if (status) status.textContent = 'Solara Vice. Press New Game to start.';
      }
    }, 40);
  })();
</script>
</body>
</html>
